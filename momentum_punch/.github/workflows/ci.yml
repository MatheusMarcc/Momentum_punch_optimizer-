name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
        working-directory: momentum_punch
      - run: ruff check .
        working-directory: momentum_punch
      - run: pytest
        working-directory: momentum_punch
